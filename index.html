ition:relative;overflow:hidden;background:radial-gradient(circle at 66% 40%,#496677,#183449 70%);min-height:325px;border-radius:17px;border:1px solid #587381}.art svg{display:block;width:100%;height:100%}.floating{position:absolute;bottom:18px;left:18px;right:18px;background:#0f2237dd;border:1px solid #7d9bab;border-radius:14px;padding:12px;font-weight:750}.gameheader{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 18px;margin-bottom:15px}.case-title{font-size:22px;margin:0}.tag{display:inline-flex;border-radius:999px;background:#3c4e55;padding:4px 9px;color:#e9f0f2;font-size:12px;font-weight:750}.tag.gold{background:#624b2e;color:#ffde9a}.tag.mint{background:#1b504d;color:#a1ece1}.tag.coral{background:#673b3e;color:#ffd3c8}.gridmain{display:grid;grid-template-columns:260px 1fr 295px;gap:15px;align-items:start}.side{padding:16px}.side h3,.chapter h3{margin:0 0 12px;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:#f4d08e}.loc-list{display:grid;gap:8px}.locbtn{width:100%;display:flex;gap:10px;align-items:center;text-align:left;border:1px solid #496373;background:#173347;border-radius:12px;padding:10px 12px;color:white;font-weight:800}.locbtn.active{background:#5d4c32;border-color:#f1c36b}.locbtn small{display:block;font-weight:500;color:#afc3cd}.locbtn .ico{font-size:25px;width:34px;text-align:center}.scene{padding:17px;min-width:0}.scene-art{width:100%;height:clamp(180px,25vw,275px);border-radius:15px;overflow:hidden;border:1px solid #527282;background:#183449;position:relative}.scene-art svg{height:100%;width:100%;display:block}.room-title{font-weight:900;font-size:27px;margin:18px 0 6px}.lead{color:#cedce2;font-size:15px}.actionlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:15px}.actioncard{border:1px solid #59737c;background:#1c3b4e;color:#f5f9fb;text-align:left;border-radius:13px;display:flex;align-items:center;gap:9px;padding:12px;min-height:74px}.actioncard:hover{background:#2e4b5a}.actioncard.done{background:#1c4040;border-color:#3f8277}.actioncard .big{font-size:24px}.actioncard b{display:block}.actioncard small{color:#c4d4de}.progress{height:8px;border-radius:99px;overflow:hidden;background:#335062}.progress>div{height:100%;background:linear-gradient(90deg,var(--mint),var(--gold));transition:width .3s}.notebox{background:#eee1bb;color:#223344;border-radius:12px;padding:13px;position:relative;border:5px solid #d5be81;box-shadow:3px 4px 0 #957e56}.notebox h4{margin:0 0 8px;font-size:17px}.notebox p{margin:0;font-size:13px}.paper{padding:18px;border-radius:14px;background:#fff7e8;color:#253341;border:1px solid #f6d696;box-shadow:0 5px 0 #b5a282}.paper h3{margin:4px 0 11px;color:#182e42}.paper p{color:#384a57}.question{text-align:left;font-weight:900;font-size:clamp(18px,2.2vw,25px);margin:20px 0 15px}.answers{display:grid;gap:9px}.answer{width:100%;padding:14px;text-align:left;border:2px solid #608293;background:#1b3a50;border-radius:12px;color:#fff;font-weight:700}.answer:hover{background:#2c5363}.answer.correct{border-color:var(--mint);background:#20554b}.answer.wrong{border-color:var(--coral);background:#603b43}.explain{background:#204951;border:1px solid #79c9bf;border-radius:13px;padding:15px;margin-top:14px}.explain.error{background:#50343b;border-color:#db998c}.large{font-size:23px;font-weight:900;margin:8px 0}.clues{display:grid;gap:9px;max-height:55vh;overflow:auto;padding-right:2px}.clue{border:1px solid #58727e;border-radius:11px;padding:12px;background:#20394a}.clue b{font-size:14px}.clue p{font-size:12px;color:#d7e1e8;margin:5px 0}.itemactions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.theory{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.theory select{width:100%;padding:12px;min-height:48px;border-radius:10px;background:#183747;color:#fff;border:1px solid #8ba4ac}.theory label{display:block;font-size:12px;color:#f1cc80;font-weight:900;margin-bottom:7px;text-transform:uppercase}.proofs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.proof{border:1px solid #57707d;border-radius:10px;background:#1c384a;padding:10px}.proof label{display:flex;gap:8px;align-items:flex-start;cursor:pointer;font-size:13px;font-weight:700}.proof input{margin-top:4px;accent-color:var(--gold);width:17px;height:17px;flex-shrink:0}.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:#0a1829f5;backdrop-filter:blur(13px)}.modal{max-width:650px;width:100%;padding:26px;text-align:center;border:2px solid #dfb76e;border-radius:22px;box-shadow:0 0 80px #dfb76e32;background:radial-gradient(circle at top,#284758,#112638 75%)}.modal .em{font-size:66px;line-height:1}.modal h2{font-size:clamp(29px,4vw,47px);margin:9px 0}.modal p{font-size:16px;color:#d0e0e7}.scorelist{display:grid;gap:9px}.scoreline{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#15354a;border:1px solid #53788b;border-radius:10px;padding:8px 11px}.scoreline b{color:var(--gold)}.brief{max-width:880px;margin:0 auto}.timeline{border-left:3px dashed #d8ae68;margin:15px 0 20px 11px;padding-left:19px}.timeline p{margin:0 0 16px}.timeline strong{color:var(--gold)}.footer{padding:18px 0 0;text-align:center;color:#8fa8b9;font-size:12px}.kicker{font-size:13px;color:#f5d48a;font-weight:850}.tiny{font-size:12px;color:#a9bfca}.tiny b{color:#fff}.hidden{display:none!important}.mark{color:var(--mint);font-weight:850}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.chip{padding:5px 8px;border-radius:8px;background:#314857;color:#e5eef1;font-size:11px;display:inline-block}.celebrate{animation:rise .7s ease-out}@keyframes rise{from{transform:translateY(15px);opacity:0}to{transform:translateY(0);opacity:1}}@media(max-width:1200px){.gridmain{grid-template-columns:230px 1fr}.rightpanel{grid-column:1/-1}.hero{grid-template-columns:1fr 1fr}}@media(max-width:760px){.app{padding:12px 12px 28px}.hero,.gridmain,.grid2{grid-template-columns:1fr}.scene{padding:13px}.actionlist,.proofs{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.theory{grid-template-columns:1fr}.mast{flex-wrap:wrap}.pad{padding:18px}.scene-art{height:200px}.side{padding:12px}.loc-list{grid-template-columns:repeat(2,minmax(0,1fr))}.room-title{font-size:24px}.pill{white-space:normal}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<body><div id="app" class="app"></div><script>
'use strict';
const SAVE_KEY='mystery_detectives_missing_mascot_v1';
const BANDS=['1-2','3-5','6-8'];
const places={gym:{name:'Gymnasium',icon:'🏀',detail:'The last confirmed location of the Ranger mascot costume.',scene:'gym'},hall:{name:'Main Hall',icon:'👣',detail:'Footsteps, lockers, and a view toward the side hallway.',scene:'hall'},art:{name:'Art Studio',icon:'🎨',detail:'Costume-making supplies are kept in this colorful room.',scene:'art'},library:{name:'Library',icon:'📚',detail:'The quietest witnesses often notice the most.',scene:'library'},office:{name:'Front Office',icon:'📋',detail:'Assembly plans and staff notes pass through this desk.',scene:'office'},storage:{name:'Supply Room',icon:'🗝️',detail:'The locked supply room near the gym.',scene:'storage'}};
const bands=(small,mid,large)=>({'1-2':small,'3-5':mid,'6-8':large});
// Case content and question packs are data: new cases can use this same engine.
const evidence=[
{id:'seam',place:'gym',icon:'🧵',title:'Loose Orange Thread',type:'Physical clue',texts:bands('A piece of orange cloth is on the gym floor. Its edge is torn.','A strip of orange fabric lies near the gym doors. One edge has a fresh tear, with several threads hanging loose.','An orange fabric scrap is caught beneath the gym bleachers. Its newly frayed edge suggests a recent tear rather than ordinary wear.'),questions:bands({q:'What happened to the cloth?',a:['It was torn.','It was painted blue.','It was made of metal.'],c:0,h:'Look for the word “torn.”',why:'The cloth has a torn edge.'},{q:'Which detail suggests the mascot costume may need repair?',a:['The orange cloth has a fresh tear.','The bleachers are folded.','The gym doors are open.'],c:0,h:'Think about why loose threads matter.',why:'A fresh tear could explain why someone would need sewing supplies.'},{q:'Which conclusion is best supported by the condition of the scrap?',a:['The costume may have been damaged recently.','A student deliberately stole the mascot.','The cloth has been there for months.'],c:0,h:'Separate what the evidence suggests from what it cannot prove.',why:'The fresh fraying suggests recent damage, but does not establish who moved the costume.'})},
{id:'schedule',place:'gym',icon:'🗓️',title:'Rehearsal Schedule',type:'Document',texts:bands('The mascot was in the gym at 2:40. The assembly starts at 3:30.','A rehearsal schedule says the mascot was used at 2:40 p.m. and was needed again for an assembly at 3:30 p.m.','The production schedule lists a 2:40 p.m. mascot rehearsal and a 3:30 p.m. assembly. A handwritten note beside the rehearsal reads, “Check costume condition before next use.”'),questions:bands({q:'What comes after 2:40?',a:['The 3:30 assembly.','The morning bus.','Lunch at noon.'],c:0,h:'Look at the two times.',why:'The assembly begins later, at 3:30.'},{q:'Why would the schedule matter to investigators?',a:['It provides a timeline for the costume.','It proves who took the costume.','It lists everyone in the school.'],c:0,h:'Schedules tell us when events occur.',why:'It establishes the costume was in use shortly before it went missing.'},{q:'What is the most defensible use of this document?',a:['To establish when the mascot was expected and when it was last scheduled.','To prove that a particular student took it.','To show that the assembly was canceled.'],c:0,h:'A schedule records planned times, not every action.',why:'The document supports a timeline; it does not identify who moved the costume.'})},
{id:'tracks',place:'hall',icon:'👟',title:'Muddy Shoeprints',type:'Physical clue',texts:bands('Muddy shoeprints are on the floor. They lead toward the supply room.','A trail of muddy prints runs from the outside entrance toward the supply-room hall. The prints are too common to identify one person.','Damp shoe impressions lead from the east entrance toward the supply corridor. Several shoes could have made the marks, so the direction is more reliable than the identity of their owner.'),questions:bands({q:'Where do the footprints go?',a:['Toward the supply room.','To the playground.','Into the ceiling.'],c:0,h:'Read where the prints lead.',why:'They point toward the supply-room hallway.'},{q:'What can the footprints tell us for certain?',a:['Someone traveled toward the supply room.','Riley stole the mascot.','A person carried the mascot costume.'],c:0,h:'A footprint records movement, not motive.',why:'The direction is supported, but the person’s identity is not.'},{q:'Which statement avoids overstating the evidence?',a:['At least one person walked toward the supply corridor.','The prints belong to the person who moved the costume.','The costume was carried by the custodian.'],c:0,h:'What is directly observable from the prints?',why:'The prints suggest movement but cannot connect one person to the missing costume.'})},
{id:'bag',place:'hall',icon:'🎒',title:'Blue-Bag Tag',type:'Physical clue',texts:bands('A blue bag tag fell by the hallway. It says STAGE CREW.','A blue fabric luggage tag labeled “STAGE CREW” lies beside the hallway lockers.','A detachable blue luggage tag bearing the words “STAGE CREW” is found near the gym corridor. Its clasp is bent, as if it pulled loose.'),questions:bands({q:'Which group is named on the tag?',a:['Stage crew.','The lunch team.','The bus drivers.'],c:0,h:'Read the words on the tag.',why:'The tag is labeled STAGE CREW.'},{q:'What is a reasonable inference from the tag?',a:['A stage-crew bag may have passed through the hall.','The mascot is inside the tag.','The librarian owns the costume.'],c:0,h:'Connect the label to where it was found.',why:'The tag may have come from equipment carried through the corridor.'},{q:'What does the tag imply, and what does it fail to prove?',a:['A stage-crew item was in the hall, but we cannot identify its carrier from the tag alone.','Riley definitely took the mascot.','All stage-crew members were absent.'],c:0,h:'Be cautious about identifying a suspect from one object.',why:'A shared stage-crew tag connects equipment to a location, not a specific individual.'})},
{id:'kit',place:'art',icon:'🪡',title:'Borrowed Repair Kit',type:'Sign-out sheet',texts:bands('Riley borrowed a sewing kit at 2:50. The art teacher wrote it down.','The art-room sign-out sheet shows that Riley borrowed a needle, blue thread, and a sewing kit at 2:50 p.m.','The art studio inventory lists a loan to Riley at 2:50 p.m.: needle, heavy-duty blue thread, scissors, and a compact fabric-repair kit.'),questions:bands({q:'Who took the sewing kit?',a:['Riley.','Kai.','The librarian.'],c:0,h:'Find the name on the sign-out sheet.',why:'Riley signed out the kit.'},{q:'Which idea does the record support?',a:['Riley may have planned to fix something made of fabric.','Riley borrowed a basketball.','Riley was absent at 2:50.'],c:0,h:'What are needles and thread used for?',why:'A sewing kit is consistent with a clothing or costume repair.'},{q:'How does this record affect the theory that the mascot was stolen?',a:['It introduces a plausible repair-related explanation.','It conclusively proves theft.','It eliminates all other explanations.'],c:0,h:'A repair kit suggests an alternative motive.',why:'The tools and timing support a repair hypothesis without proving it on their own.'})},
{id:'thread',place:'art',icon:'🔎',title:'Matching Thread Spool',type:'Physical clue',texts:bands('A spool of blue thread has a label: COSTUME FIX.','One blue thread spool is labeled “costume repair.” A strip of orange thread is caught under the spool.','A blue thread spool marked “costume repair” has orange fibers stuck beneath its label, providing a possible connection to the orange fabric found in the gym.'),questions:bands({q:'What job is written on the spool?',a:['Costume repair.','Painting a wall.','Moving books.'],c:0,h:'Look at the spool label.',why:'It says costume repair.'},{q:'Why might the orange thread be important?',a:['It may connect the repair materials with the torn orange fabric.','It tells us who opened the office.','It proves the gym is flooded.'],c:0,h:'Remember the cloth in the gym.',why:'The similar fibers might link the two clues, although color alone is not a perfect match.'},{q:'Which inference is strongest when paired with the gym fabric?',a:['The thread may have been used on damaged orange costume material.','The orange fabric and thread must be unrelated.','The spool identifies the person who took the mascot.'],c:0,h:'Combine material evidence without assuming it identifies a person.',why:'Together, the fabric and spool strengthen a repair hypothesis.'})},
{id:'memo',place:'office',icon:'✉️',title:'Unsent Message',type:'Office memo',texts:bands('A message says, “The mascot is safe. I am fixing it.” It has no name.','An unfinished message on the front-office computer reads, “The mascot is safe. I am fixing the torn seam. I will bring it back before the assembly.” It has not been sent.','An unsent front-office draft reads, “Mascot secured; torn seam repair underway. Expect return before the 3:30 assembly.” The message has no signature or confirmed sender.'),questions:bands({q:'What does the message say?',a:['The mascot is being fixed.','The mascot is in the cafeteria.','The assembly is tomorrow.'],c:0,h:'Read the sentence about fixing.',why:'The note says someone is repairing the mascot.'},{q:'Why is the unfinished message helpful?',a:['It suggests someone intended to return the mascot.','It proves the sender wrote the schedule.','It identifies the sender by name.'],c:0,h:'What does a promise to return suggest about intent?',why:'The note suggests an attempted repair, but the writer is not confirmed.'},{q:'How should an investigator evaluate this anonymous draft?',a:['It supports a repair motive but does not identify who wrote it.','It is sufficient proof that Riley wrote it.','It proves the mascot never left the gym.'],c:0,h:'A document without a signature has limits.',why:'The wording supports a repair explanation, but the sender remains unknown.'})},
{id:'keylog',place:'storage',icon:'🔑',title:'Supply-Room Key Log',type:'Sign-out sheet',texts:bands('Riley borrowed the supply-room key at 2:57.','The custodian’s log shows that Riley checked out the supply-room key at 2:57 p.m. and returned it at 3:16 p.m.','A signed key ledger records that Riley obtained the supply-room key at 2:57 p.m. and returned it at 3:16 p.m. The location is close to the gym and has a worktable.'),questions:bands({q:'Who had the supply-room key?',a:['Riley.','The bus driver.','The principal.'],c:0,h:'Look at the name in the log.',why:'The entry names Riley.'},{q:'What is the key log evidence of?',a:['Riley had access to the supply room.','Riley certainly stole the mascot.','The costume was sold.'],c:0,h:'Having a key proves access, not wrongdoing.',why:'It connects Riley to a location where the mascot might have been moved.'},{q:'What does the key log establish when combined with the repair-kit record?',a:['Riley had both repair tools and access to a work area.','Riley confessed to stealing the costume.','The mascot costume was destroyed.'],c:0,h:'Link tools, opportunity, and location; do not assume a crime.',why:'Taken together, these records strongly support a possible repair in the supply room.'})}
];
const interviews=[
{id:'riley',place:'gym',name:'Riley',role:'Stage Manager',icon:'🎭',texts:bands('“I saw a tear on the mascot. I wanted to help before the assembly.”','“The mascot had a ripped seam. I was worried the costume would fall apart during the assembly, so I tried to find a way to repair it.”','“I spotted a split seam during rehearsal and was concerned it would worsen at the assembly. I decided to deal with it quickly, but I should have told the team my plan.”'),questions:bands({q:'Why was Riley worried?',a:['The costume was torn.','It was snowing.','The gym was locked.'],c:0,h:'What was wrong with the mascot?',why:'Riley noticed the tear.'},{q:'What was Riley’s likely motivation?',a:['To prevent the damaged costume from getting worse.','To cancel the assembly.','To hide a basketball.'],c:0,h:'What problem did Riley describe?',why:'Riley says the goal was to protect the costume.'},{q:'How should a detective treat Riley’s statement?',a:['As a possible explanation that should be checked against records.','As unquestionable proof of innocence.','As evidence that the librarian moved it.'],c:0,h:'Witnesses can have useful information but still need corroboration.',why:'Riley’s account should be compared with the repair-kit and key logs.'})},
{id:'morgan',place:'art',name:'Morgan',role:'Art Club Leader',icon:'🖌️',texts:bands('“Riley came in for sewing supplies.”','“Riley asked me for strong thread and a repair kit shortly before 3:00. They seemed to be in a hurry.”','“Just before three, Riley asked for a heavy-duty needle and matching thread. The request sounded urgent, but Riley did not explain exactly what needed fixing.”'),questions:bands({q:'Who asked Morgan for supplies?',a:['Riley.','Kai.','Taylor.'],c:0,h:'Find the name in Morgan’s words.',why:'Morgan named Riley.'},{q:'Which detail supports Morgan’s statement?',a:['The repair-kit sign-out sheet.','The muddy footprints.','The library’s book list.'],c:0,h:'Which other clue records a supply loan?',why:'The art-room sign-out sheet corroborates Morgan’s statement.'},{q:'What makes Morgan’s statement relatively credible?',a:['It can be checked against the dated supply record.','Morgan speaks the loudest.','Morgan likes costumes.'],c:0,h:'Good testimony can be verified independently.',why:'The dated record independently supports the reported request.'})},
{id:'kai',place:'hall',name:'Kai',role:'Basketball Player',icon:'🏀',texts:bands('“I came in from outside. My shoes were muddy. I did not see the mascot.”','“I came back from the wet outdoor courts at about 3:00. My shoes were muddy, but I was headed to basketball practice.”','“At around three, I walked in from the wet outdoor courts. I realize my muddy shoes may have left prints, but I had practice and did not handle the mascot costume.”'),questions:bands({q:'Why were Kai’s shoes muddy?',a:['Kai came from outside.','Kai painted them.','Kai stepped in a cake.'],c:0,h:'Where was Kai before entering?',why:'Kai had been at the outdoor courts.'},{q:'Why should detectives be cautious about the footprints?',a:['Several people could have made them.','Footprints never show movement.','Kai must have moved the mascot.'],c:0,h:'Are the prints unique?',why:'The tracks alone cannot identify the owner or connect them to the costume.'},{q:'Which interpretation best handles Kai’s statement?',a:['It offers a possible source for footprints but does not establish who moved the mascot.','It proves Kai is lying.','It establishes that no one entered the hall.'],c:0,h:'Consider both useful details and their limits.',why:'The testimony offers context but cannot settle the case alone.'})},

function blank(){return {version:1,caseId:CASE.id,config:structuredClone(tempSetup),step:'brief',current:0,turn:0,opened:[],talked:[],points:[0,0,0,0],mistakes:0,finished:false,win:false,started:Date.now(),completeAt:null,attempts:{},wrongFinal:0};}
function save(){try{if(state)localStorage.setItem(SAVE_KEY,JSON.stringify(state));}catch(e){console.warn('Save unavailable',e)}}

function setup(){return mast()+`<div class="panel pad brief"><span class="eyebrow">CREATE A CASE FILE</span><h1 class="title" style="font-size:38px">Assemble your detective team</h1><div class="formgrid"><div class="formfield"><label for="band">Reading level</label><select id="band"><option value="1-2" ${tempSetup.band==='1-2'?'selected':''}>Grades 1–2 • Short clues</option><option value="3-5" ${tempSetup.band==='3-5'?'selected':''}>Grades 3–5 • Reading & inference</option><option value="6-8" ${tempSetup.band==='6-8'?'selected':''}>Grades 6–8 • Evidence & reasoning</option></select></div><div class="formfield"><label for="count">Detectives</label><select id="count">${[1,2,3,4].map(n=>`<option value="${n}" ${tempSetup.players===n?'selected':''}>${n} ${n===1?'player':'players'} • 1 device</option>`).join('')}</select></div><div class="formfield"><label for="mode">How to play</label><select id="mode"><option value="coop" ${tempSetup.mode==='coop'?'selected':''}>Cooperative • One shared score</option><option value="versus" ${tempSetup.mode==='versus'?'selected':''}>Friendly competition • Individual scores</option></select></div><div class="formfield"><label for="length">Case length</label><select id="length">${Object.entries(goals).map(([id,g])=>`<option value="${id}" ${tempSetup.length===id?'selected':''}>${g.label} • ${g.minutes}</option>`).join('')}</select></div><div class="formfield"><label for="difficulty">Challenge level</label><select id="difficulty">${Object.entries(levels).map(([id,g])=>`<option value="${id}" ${tempSetup.difficulty===id?'selected':''}>${g.name}</option>`).join('')}</select><div id="difficultyInfo" class="info">${levels[tempSetup.difficulty].text}</div></div><div class="formfield"><span>Reading assistance</span><label class="checklabel"><input type="checkbox" id="hints" ${tempSetup.hints?'checked':''}> Show helpful explanations</label><div class="info">Student-friendly clue explanations still appear after challenges.</div></div></div><hr class= function promptQuestion(){const {type,id,tries}=questionState;const item=(type==='evidence'?evidence:interviews).find(x=>x.id===id),q=item.questions[state.config.band];const wrong=tries>0;const showHint=state.config.difficulty!=='master'&&state.config.hints&&wrong;let text=item.texts[state.config.band];return mast()+hud()+`<section class="panel pad brief"><div class="controls" style="justify-content:space-between"><span class="eyebrow">${type==='evidence'?'EXAMINE EVIDENCE':'WITNESS INTERVIEW'}</span><button class="btn ghost small" data-action="questionBack">← Return to room</button></div><h1 style="font-size:32px;margin:9px 0">${item.icon} ${h(type==='evidence'?item.title:item.name)}</h1><div class="paper"><span class="eyebrow" style="color:#835e28">${h(type==='evidence'?item.type:item.role)}</span><p style="font-size:clamp(16px,2vw,19px)">${h(text)}</p></div><div class="controls" style="margin-top:14px"><button class="btn secondary small" data-action="readAloud">🔊 Read clue & question aloud</button></div><div class="question">${h(q.q)}</div><div class="answers">${questionState.order.map((i,j)=>`<button class="answer" data-action="answer" data-n="${i}">${String.fromCharCode(65+j)}. ${h(q.a[i])}</button>`).join('')}</div>${wrong?`<div class="explain error"><b>⚠ Recheck your evidence.</b> That answer isn't supported by the text.${showHint?`<div style="margin-top:7px">💡 ${h(q.h)}</div>`:''}<div class="tiny" style="margin-top:7px">Mistakes help detectives learn. Try again.</div></div>`:''}<p class="info">${state.config.difficulty==='rookie'?'No penalty for trying again.':`Attempt ${tries+1} · Points decrease after incorrect answers.`}</p></section>`}
function feedback(){let o=result;return mast()+hud()+`<div class="panel pad brief celebrate"><span class="eyebrow">${o.assisted?'READING SUPPORT':'CLUE VERIFIED'}</span><h1 class="title" style="font-size:42px">${o.assisted?'📚 Learning from the clue':'✅ Nice detective work!'}</h1><div class="paper"><h3>${h(o.title)}</h3><p>${h(o.why)}</p><p>${h(o.text)}</p></div><div class="stat" style="margin:20px 0"><span>${h(playerName(o.player))} earned</span><b>+${o.points} investigation points</b></div><p class="info">${state.config.players>1?'Next, hand the Chromebook to the detective whose name appears on screen.':'Keep looking for connections between the clues.'}</p><button class="btn primary" data-action="afterAnswer">${state.config.players>1?'Finish Turn →':'Continue Investigating →'}</button></div>`}
function theory(){const p=progress();if(!p.ready){view='game';render();return}return mast()+hud()+`<div class="panel pad"><div class="controls" style="justify-content:space-between"><div><span class="eyebrow">DETECTIVE'S THEORY</span><h1 style="margin:5px 0">🧩 Solve the Case</h1></div><button class="btn ghost small" data-action="return">← Keep Investigating</button></div><p class="lead">Answer all three questions. Select at least <b>two pieces of evidence</b> that support your conclusion. Read carefully: not every clue proves the same thing.</p><div class="theory"><div><label for="who">Who moved the costume?</label><select id="who"><option value="">Choose a person…</option><option value="riley" ${theoryDraft.who==='riley'?'selected':''}>Riley • Stage Manager</option><option value="morgan" ${theoryDraft.who==='morgan'?'selected':''}>Morgan • Art Club</option><option value="kai" ${theoryDraft.who==='kai'?'selected':''}>Kai • Basketball Player</option><option value="taylor" ${theoryDraft.who==='taylor'?'selected':''}>Taylor • Library Assistant</option></select></div><div><label for="where">Where is it?</label><select id="where"><option value="">Choose a place…</option><option value="gym" ${theoryDraft.where==='gym'?'selected':''}>Gymnasium</option><option value="art" ${theoryDraft.where==='art'?'selected':''}>Art Studio</option><option value="library" ${theoryDraft.where==='library'?'selected':''}>Library</option><option value="storage" ${theoryDraft.where==='storage'?'selected':''}>Supply Room</option></select></div><div><label for="why">Why was it moved?</label><select id="why"><option value="">Choose a reason…</option><option value="repair" ${theoryDraft.why==='repair'?'selected':''}>To repair a damaged seam</option><option value="hide" ${theoryDraft.why==='hide'?'selected':''}>To prevent the assembly</option><option value="sell" ${theoryDraft.why==='sell'?'selected':''}>To sell the costume</option><option value="prank" ${theoryDraft.why==='prank'?'selected':''}>As a prank</option></select></div></div><hr class="divider"><h3 class="kicker">CHOOSE YOUR EVIDENCE</h3><div class="proofs">${state.opened.map(id=>{const o=evidence.find(e=>e.id===id);return `<div class="proof"><label><input type="checkbox" name="proof" value="${o.id}" ${theoryDraft.proofs.includes(o.id)?'checked':''}><span>${o.icon} ${h(o.title)}<br><small style="color:#adc8d3">${h(o.type)}</small></span></label></div>`}).join('')}</div>${scoreNotice?`<div class="explain error" role="status"><b>Case review:</b> ${h(scoreNotice)}</div>`:''}<div class="controls" style="margin-top:20px"><button class="btn primary" data-action="submit">📌 Submit Case Report</button><button class="btn ghost" data-action="notebook">Review Notebook</button></div></div>`}
function finale(){const rank=Array.from({length:state.config.players},(_,i)=>({name:playerName(i),score:state.points[i]})).sort((a,b)=>b.score-a.score);return mast()+`<div class="panel pad brief celebrate"><span class="eyebrow">CASE FILE 001 • CLOSED</span><h1 class="title">🏆 Mystery Solved!</h1><p class="lede">The Ranger mascot costume was never stolen. Your detective team uncovered the truth by connecting witness statements, a torn costume seam, and school records.</p><div class="paper"><h3>What really happened?</h3><p><b>Riley, the stage manager, moved the mascot costume to the supply room to repair a torn seam.</b> Riley meant to help before the 3:30 assembly but failed to tell the rest of the team where the costume went.</p></div><h3 style="margin:24px 0 8px">Reconstructed timeline</h3><div class="timeline"><p><strong>2:40 p.m.</strong> — The mascot is used at rehearsal. A seam is torn.</p><p><strong>2:50 p.m.</strong> — Riley checks out a sewing kit and thread from the art room.</p><p><strong>About 2:55 p.m.</strong> — A bulky blue stage-crew bag is seen in the hallway.</p><p><strong>2:57 p.m.</strong> — Riley checks out the supply-room key.</p><p><strong>3:16 p.m.</strong> — Riley returns the key after working on the repair.</p><p><strong>Before 3:30 p.m.</strong> — The repaired mascot is returned for the assembly.</p></div><h3>Investigation Scores</h3><div class="stat" style="margin-bottom:12px"><span>Team total</span><b>${state.points.slice(0,state.config.players).reduce((a,b)=>a+b,0)} points</b></div><div class="scorelist">${rank.map((o,i)=>`<div class="scoreline"><span>${i===0?'🏅':'🔍'} ${h(o.name)}</span><b>${o.score} pts</b></div>`).join('')}</div><p class="info" style="margin-top:15px">${state.opened.length} evidence items examined · ${state.talked.length} witnesses interviewed · ${state.mistakes} reading corrections · ${state.wrongFinal} revised case reports</p><div class="controls" style="margin-top:22px"><button class="btn primary" data-action="new">Start Another Investigation</button><button class="btn ghost" data-action="menu">Main Menu</button><button class="btn secondary" data-action="notebook">Review Notes</button></div></div>`}
function overlayContent(){if(!handoff||!state)return '';const next=(state.current+1)%state.config.players;return `<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="handoffTitle"><div class="modal"><div class="em">🔐</div><span class="eyebrow">DETECTIVE HANDOFF</span><h2 id="handoffTitle">Next Detective!</h2><p>Please hand the Chromebook to <b style="color:var(--gold)">${h(playerName(next))}</b>. This screen keeps the last student's clues and answers out of sight until the next person is ready.</p><p class="tiny">${state.config.mode==='coop'?'Work together: discuss clues after the next detective begins.':'Each answer earns individual detective points.'}</p><button class="btn primary" data-action="nextPlayer">I'm ${h(playerName(next))} — Ready!</button></div></div>`}
function menuOverlay(){return `<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="menuTitle"><div class="modal"><div class="em">🗂️</div><h2 id="menuTitle">Case Paused</h2><p>Your investigation is saved on this browser and this device. You can resume it later.</p><div class="controls" style="justify-content:center"><button class="btn primary" data-action="resumeGame">Resume Game</button><button class="btn secondary" data-action="goHome">Main Menu</button><button class="btn danger" data-action="confirmRestart">Restart Case</button></div></div></div>`}
let menuOpen=false;function render(){let el=$('app');let html=view==='home'?home():view==='setup'?setup():view==='brief'?brief():view==='game'?game():view==='question'?promptQuestion():view==='feedback'?feedback():view==='notebook'?notebook():view==='theory'?theory():view==='won'?finale():home();el.innerHTML=html+(handoff?overlayContent():menuOpen?menuOverlay():'');document.title=`Mystery Detectives • ${state?.finished?'Case Closed':CASE.title}`}
function startQuestion(type,id){if(!state||isDone(type,id)){view='notebook';render();return}const order=[0,1,2];for(let i=2;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}questionState={type,id,tries:0,order};view='question';render()}
function answer(n){if(view!=='question')return;let {type,id}=questionState;let item=(type==='evidence'?evidence:interviews).find(x=>x.id===id),q=item.questions[state.config.band];if(n!==q.c){state.mistakes++;questionState.tries++;save();if(questionState.tries>=3&&state.config.difficulty!=='rookie'){finishQuestion(true)}else render();return}finishQuestion(false)}
function finishQuestion(assisted){let {type,id,tries}=questionState,item=(type==='evidence'?evidence:interviews).find(x=>x.id===id),q=item.questions[state.config.band];let pts=assisted?0:state.config.difficulty==='rookie'?3:Math.max(1,(state.config.difficulty==='master'?6:state.config.difficulty==='investigator'?5:4)-tries*2);let player=state.current;state.points[player]+=pts;if(type==='evidence'&&!state.opened.includes(id))state.opened.push(id);if(type==='interview'&&!state.talked.includes(id))state.talked.push(id);save();result={title:type==='evidence'?item.title:item.name,why:(assisted?'The supported answer is: '+q.a[q.c]+' '+q.why:q.why),text:item.texts[state.config.band],points:pts,player,assisted};view='feedback';questionState=null;render()}
function afterAnswer(){if(state.config.players>1){handoff=true;view='game';room=room;render()}else{view='game';render()}}
function submitTheory(){if(view!=='theory')return;let who=$('who')?.value,where=$('where')?.value,why=$('why')?.value,proofs=[...document.querySelectorAll('[name="proof"]:checked')].map(x=>x.value);theoryDraft={who,where,why,proofs};if(!who||!where||!why||proofs.length<2){scoreNotice='Complete all three conclusions and choose at least two supporting clues.';render();return}if(who===CASE.who&&where===CASE.where&&why===CASE.why&&proofs.filter(x=>CASE.proofs.includes(x)).length>=2){state.finished=true;state.win=true;state.completeAt=Date.now();save();view='won';scoreNotice='';render();return}state.wrongFinal++;save();if(who!==CASE.who)scoreNotice='The person you chose does not fit all the sign-out records. Check the witnesses and the key log.';else if(where!==CASE.where)scoreNotice='The location does not match the trail of access records. Look for the key log.';else if(why!==CASE.why)scoreNotice='Your proposed motive does not explain the sewing tools and damaged fabric.';else scoreNotice='Your chosen proof does not sufficiently support the full explanation. Include records related to repairs or supply-room access.';view='theory';render()}
function speakQuestion(){if(!questionState||!('speechSynthesis' in window))return;const item=(questionState.type==='evidence'?evidence:interviews).find(x=>x.id===questionState.id);const q=item.questions[state.config.band];try{speechSynthesis.cancel();const msg=new SpeechSynthesisUtterance(item.texts[state.config.band]+'. '+q.q+'. '+q.a.map((a,i)=>'Option '+String.fromCharCode(65+i)+': '+q.a[questionState.order[i]]).join('. '));msg.rate=state.config.band==='1-2'?.82:.94;msg.lang='en-US';speechSynthesis.speak(msg)}catch(err){console.warn('Read aloud unavailable',err)}}
function clickAction(e){const target=e.target.closest('[data-action]');if(!target||target.disabled)return;let action=target.dataset.action,id=target.dataset.id;switch(action){case'new':tempSetup=state?.config?structuredClone(state.config):tempSetup;tempSetup.names=tempSetup.names.slice();view='setup';menuOpen=false;handoff=false;state=null;theoryDraft={who:'',where:'',why:'',proofs:[]};render();break;case'menu':if(state&&view!=='home'&&view!=='setup'){menuOpen=true;render()}else{view='home';render()}break;case'resume':{const found=readSave();if(found){state=found;room='gym';view=state.finished?'won':state.step==='brief'?'brief':'game';menuOpen=false;handoff=false;render()}break}case'goHome':menuOpen=false;view='home';render();break;case'resumeGame':menuOpen=false;render();break;case'confirmRestart':if(confirm('Delete the saved investigation and start again?')){clearSave();state=null;menuOpen=false;view='setup';render()}break;case'start':harvest();state=blank();state.step='brief';save();view='brief';render();break;case'enter':state.step='game';save();view='game';render();break;case'place':if(!handoff&&!menuOpen){room=id;view='game';render()}break;case'evidence':case'interview':startQuestion(action,id);break;case'answer':try{if('speechSynthesis' in window)speechSynthesis.cancel()}catch(e){}answer(Number(target.dataset.n));break;case'readAloud':speakQuestion();break;case'questionBack':view='game';questionState=null;render();break;case'afterAnswer':afterAnswer();break;case'nextPlayer':state.current=(state.current+1)%state.config.players;state.turn++;save();handoff=false;view='game';render();break;case'notebook':if(!state)return;scoreNotice='';view='notebook';render();break;case'return':scoreNotice='';view=state?.finished?'won':'game';render();break;case'theory':if(state&&progress().ready){scoreNotice='';theoryDraft={who:'',where:'',why:'',proofs:[]};view='theory';render()}break;case'submit':submitTheory();break;default:break}}
function onSelect(e){if(view!=='setup')return;if(e.target.id==='count'){harvest();render();return}if(e.target.id==='difficulty'){const d=$('difficultyInfo');if(d)d.textContent=levels[e.target.value].text}}
document.addEventListener('click',clickAction);document.addEventListener('change',onSelect);render();
</script></body></html>
